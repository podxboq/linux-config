# ── Fuente ────────────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        10.0

# Ligaduras activas (→ != >= <= etc.)
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor                #8CC09D
cursor_text_color     #1C211E

# ── Scroll ────────────────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ── Ventana ───────────────────────────────────────────────────────────────────
window_padding_width    10
placement_strategy      center
hide_window_decorations no
remember_window_size    yes

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_min_tabs       2
active_tab_font_style  bold
inactive_tab_font_style normal

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Wayland ───────────────────────────────────────────────────────────────────
linux_display_server wayland

# ── Paleta podxboq (tema oscuro, verde salvia) ────────────────────────────────
background            #1C211E
foreground            #E6EBE7
selection_background  #3F7350
selection_foreground  #FFFFFF

# Cursor de texto en apps
url_color             #8CC09D
url_style             curly

# Colores ANSI — apagados para fondo gris verdoso oscuro
# Normal
color0  #2C332F
color1  #E07A6E
color2  #8CC09D
color3  #D9B46A
color4  #7FA8CC
color5  #B79AD0
color6  #6FC0B0
color7  #C9D1CB

# Brillantes
color8  #7A847E
color9  #F09A8F
color10 #A8D6B6
color11 #E8CB8C
color12 #9DC0DE
color13 #CDB5E2
color14 #8ED6C8
color15 #E6EBE7

# Tab bar
active_tab_background   #3F7350
active_tab_foreground   #FFFFFF
inactive_tab_background #2A312D
inactive_tab_foreground #A5ACA8
tab_bar_background      #161A18
