# ── Fuente ────────────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        10.0

# Ligaduras activas (→ != >= <= etc.)
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor                #2C6E8A
cursor_text_color     #FFFFFF

# ── Scroll ────────────────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ── Ventana ───────────────────────────────────────────────────────────────────
window_padding_width    10
placement_strategy      center
hide_window_decorations no
remember_window_size    yes

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_min_tabs       2
active_tab_font_style  bold
inactive_tab_font_style normal

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Wayland ───────────────────────────────────────────────────────────────────
linux_display_server wayland

# ── Paleta Neblina (tema claro) ───────────────────────────────────────────────
background            #FFFFFF
foreground            #072436
selection_background  #D4E3EE
selection_foreground  #072436

# Cursor de texto en apps
url_color             #2C6E8A
url_style             curly

# Colores ANSI — adaptados a fondo claro
# Normal
color0  #4A5568
color1  #C0392B
color2  #27AE60
color3  #B7770D
color4  #2C6E8A
color5  #7D3C98
color6  #17A589
color7  #F2F2F7

# Brillantes
color8  #718096
color9  #E74C3C
color10 #2ECC71
color11 #D4AC0D
color12 #5B8FA8
color13 #9B59B6
color14 #1ABC9C
color15 #FFFFFF

# Tab bar
active_tab_background   #2C6E8A
active_tab_foreground   #FFFFFF
inactive_tab_background #F2F2F7
inactive_tab_foreground #8FA3AF
tab_bar_background      #F2F2F7
