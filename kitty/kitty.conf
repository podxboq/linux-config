# ── Fuente ────────────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        10.0

# Ligaduras activas (→ != >= <= etc.)
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor                #2C6E8A
cursor_text_color     #FFFFFF

# ── Scroll ────────────────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# ── Ventana ───────────────────────────────────────────────────────────────────
window_padding_width    10
placement_strategy      center
hide_window_decorations no
remember_window_size    yes

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_min_tabs       2
active_tab_font_style  bold
inactive_tab_font_style normal

# ── Bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Wayland ───────────────────────────────────────────────────────────────────
linux_display_server wayland

# ── Paleta Neblina (tema oscuro) ─────────────────────────────────────────────
background            #0D1F2D
foreground            #E8F1F5
selection_background  #2C6E8A
selection_foreground  #FFFFFF

# Cursor de texto en apps
url_color             #5B8FA8
url_style             curly

# Colores ANSI — adaptados a fondo oscuro marino
# Normal
color0  #2D3F50
color1  #E05C4B
color2  #2ECC71
color3  #D4AC0D
color4  #5B8FA8
color5  #9B59B6
color6  #1ABC9C
color7  #C8D8E2

# Brillantes
color8  #4A6070
color9  #FF7060
color10 #55D98D
color11 #FFD060
color12 #7BAFD4
color13 #C39BD3
color14 #48CAE4
color15 #E8F1F5

# Tab bar
active_tab_background   #2C6E8A
active_tab_foreground   #FFFFFF
inactive_tab_background #1A3040
inactive_tab_foreground #8FA3AF
tab_bar_background      #0A1820
